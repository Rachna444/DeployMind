name: DeployMind CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploymind-ci:
    name: DeployMind Analysis & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic

      - name: Run DeployMind Core Unit Tests
        run: |
          python -m unittest discover -s deploymind_core -p "test_*.py"

      - name: Run Validation Unit Tests
        run: |
          python -m unittest discover -s validation -p "test_*.py"

      - name: Execute DeployMind Pipeline
        run: |
          python -m deploymind_core.pipeline.orchestrator
