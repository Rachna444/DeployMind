version: '3.8'

services:
  gateway:
    build:
      context: ./app/gateway
    ports:
      - "8000:8000"
    networks:
      - deploymind-network
    depends_on:
      - task_service

  task_service:
    build:
      context: ./app/task_service
    ports:
      - "8001:8001"
    networks:
      - deploymind-network
    depends_on:
      - worker_service

  worker_service:
    build:
      context: ./app/worker_service
    ports:
      - "8002:8002"
    networks:
      - deploymind-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - deploymind-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - deploymind-network

networks:
  deploymind-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
