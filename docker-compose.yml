version: '3.8'

services:
  gateway:
    build:
      context: ./app/gateway
    ports:
      - "8000:8000"
    networks:
      - deploymind-network
    depends_on:
      - task_service

  task_service:
    build:
      context: ./app/task_service
    ports:
      - "8001:8001"
    networks:
      - deploymind-network
    depends_on:
      - worker_service

  worker_service:
    build:
      context: ./app/worker_service
    ports:
      - "8002:8002"
    networks:
      - deploymind-network

networks:
  deploymind-network:
    driver: bridge
