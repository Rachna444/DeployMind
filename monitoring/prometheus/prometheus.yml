global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:8000', 'localhost:8000']

  - job_name: 'task_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['task_service:8001', 'localhost:8001']

  - job_name: 'worker_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker_service:8002', 'localhost:8002']
